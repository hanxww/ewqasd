<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta id="themeColor" name="theme-color" content="#F7F8FA" />
  <meta name="description" content="Сайты, Telegram-боты, CRM и автоматизация для бизнеса. Лендинги от 5 000 ₽, боты от 7 000 ₽, комплексные решения от 10 000 ₽." />
  <title>hanxw — сайты, Telegram-боты и автоматизация</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    :root{
      --bg:#0b0f14;
      --bg-soft:#10161d;
      --panel:#131a22;
      --panel-2:#171f29;
      --text:#f4f7fb;
      --muted:#9ea9b8;
      --line:rgba(255,255,255,.09);
      --accent:#6ee7f9;
      --accent-2:#8b5cf6;
      --accent-dark:#051116;
      --success:#6ee7b7;
      --danger:#fca5a5;
      --max:1180px;
      --radius:22px;
      --shadow:0 24px 70px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 5%,rgba(139,92,246,.12),transparent 28%),
        radial-gradient(circle at 90% 18%,rgba(110,231,249,.08),transparent 25%),
        var(--bg);
      color:var(--text);
      line-height:1.65;
    }
    a{color:inherit;text-decoration:none}
    button,input,textarea{font:inherit}
    img{max-width:100%;display:block}
    section{scroll-margin-top:92px}

    .container{width:min(var(--max),calc(100% - 40px));margin:0 auto}
    .eyebrow{
      color:var(--accent);
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:12px;
      font-weight:800;
      margin-bottom:12px
    }
    .section-title{
      margin:0;
      font-size:clamp(34px,5vw,56px);
      line-height:1.05;
      letter-spacing:-.045em
    }
    .section-copy{
      max-width:760px;
      color:var(--muted);
      font-size:17px;
      margin:18px 0 0
    }

    /* navbar */
    .nav-wrap{
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(18px);
      background:rgba(11,15,20,.72);
      border-bottom:1px solid rgba(255,255,255,.06)
    }
    .nav{
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:22px
    }
    .brand{
      font-weight:800;
      letter-spacing:-.03em;
      white-space:nowrap
    }
    .brand span{color:var(--accent)}
    .nav-links{
      display:flex;
      align-items:center;
      gap:24px;
      font-size:14px;
      color:#c8d0db
    }
    .nav-links a:not(.btn):hover{color:#fff}
    .burger{
      display:none;
      width:44px;height:44px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:white;
      cursor:pointer
    }

    /* buttons */
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      min-height:48px;
      padding:0 20px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:#fff;
      font-weight:800;
      font-size:14px;
      cursor:pointer;
      transition:.2s ease;
    }
    .btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2)}
    .btn.primary{
      color:#061013;
      background:linear-gradient(135deg,#c5f6ff,var(--accent));
      border-color:transparent;
      box-shadow:0 14px 40px rgba(110,231,249,.14)
    }
    .btn.ghost{background:transparent}
    .btn.small{min-height:42px;padding:0 16px;border-radius:12px}
    .btn.full{width:100%}

    /* hero */
    .hero{
      min-height:calc(100vh - 72px);
      display:grid;
      grid-template-columns:1.02fr .98fr;
      align-items:center;
      gap:58px;
      padding:54px 0 56px
    }
    .hero h1{
      margin:0;
      font-size:clamp(48px,6vw,76px);
      letter-spacing:-.065em;
      line-height:.98
    }
    .hero h1 .accent{
      background:linear-gradient(90deg,#fff,var(--accent));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent
    }
    .hero-copy{
      margin:24px 0 30px;
      max-width:680px;
      color:#b6c0cd;
      font-size:18px
    }
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px}
    .hero-price{
      margin-top:24px;
      color:#8f9baa;
      font-size:14px
    }
    .hero-price strong{color:#fff}

    /* hero mockup */
    .system-visual{
      position:relative;
      min-height:520px;
      display:grid;
      place-items:center
    }
    .glow{
      position:absolute;
      width:380px;height:380px;border-radius:50%;
      background:radial-gradient(circle,rgba(110,231,249,.14),rgba(139,92,246,.08) 45%,transparent 70%);
      filter:blur(8px)
    }
    .laptop{
      position:absolute;
      width:78%;
      min-width:360px;
      aspect-ratio:16/10;
      left:0;
      top:60px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:20px 20px 12px 12px;
      background:#091016;
      padding:12px;
      box-shadow:var(--shadow);
      transform:rotate(-2deg)
    }
    .browser{
      width:100%;height:100%;
      background:linear-gradient(145deg,#f6f7fb,#e8ebf2);
      border-radius:12px;
      overflow:hidden;
      color:#0f172a
    }
    .browser-top{
      height:28px;
      background:#dfe3ea;
      display:flex;
      align-items:center;
      gap:5px;
      padding:0 10px
    }
    .dot{width:7px;height:7px;border-radius:50%;background:#9aa5b4}
    .browser-body{padding:26px}
    .mock-label{font-size:10px;font-weight:800;color:#7c3aed;letter-spacing:.08em;text-transform:uppercase}
    .mock-title{font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:7px 0 10px}
    .mock-copy{width:78%;height:8px;border-radius:99px;background:#cfd6df;margin-bottom:7px}
    .mock-copy.short{width:55%}
    .mock-btn{display:inline-block;margin-top:18px;background:#111827;color:white;border-radius:8px;padding:9px 13px;font-size:9px;font-weight:800}
    .mock-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:25px}
    .mock-card{height:58px;background:white;border:1px solid #d9dee7;border-radius:9px}

    .phone{
      position:absolute;
      width:190px;
      height:390px;
      right:12px;
      bottom:24px;
      border-radius:30px;
      background:#050709;
      border:1px solid rgba(255,255,255,.18);
      padding:10px;
      box-shadow:0 28px 80px rgba(0,0,0,.5);
      transform:rotate(4deg)
    }
    .phone-screen{
      height:100%;
      border-radius:22px;
      overflow:hidden;
      background:#e7edf4;
      color:#132333;
      padding:14px 12px
    }
    .tg-head{font-size:11px;font-weight:800;text-align:center;margin-bottom:18px}
    .chat{
      max-width:86%;
      margin:8px 0;
      padding:8px 9px;
      border-radius:10px;
      background:white;
      font-size:9px;
      line-height:1.4
    }
    .chat.me{margin-left:auto;background:#c9f2d0}
    .quick{display:grid;gap:6px;margin-top:14px}
    .quick span{background:#4c8bf5;color:#fff;text-align:center;padding:7px;border-radius:7px;font-size:8px;font-weight:700}

    .crm-card{
      position:absolute;
      right:2px;
      top:25px;
      width:218px;
      padding:18px;
      border-radius:18px;
      background:rgba(20,27,35,.94);
      border:1px solid rgba(255,255,255,.13);
      box-shadow:var(--shadow)
    }
    .crm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .crm-top strong{font-size:13px}
    .status{font-size:9px;padding:4px 7px;border-radius:99px;background:rgba(110,231,183,.12);color:var(--success)}
    .crm-row{padding:10px 0;border-top:1px solid var(--line)}
    .crm-row span{display:block;color:#8d99a8;font-size:9px}
    .crm-row b{font-size:11px}
    .flow-line{
      position:absolute;
      bottom:2px;
      left:80px;
      display:flex;
      align-items:center;
      gap:8px;
      color:#8391a1;
      font-size:11px;
      font-weight:700
    }
    .flow-node{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#111820;color:#dce4ed}
    .arrow{color:var(--accent)}

    /* sections */
    .section{padding:94px 0}
    .alt{
      background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.006));
      border-top:1px solid rgba(255,255,255,.035);
      border-bottom:1px solid rgba(255,255,255,.035)
    }

    /* services */
    .services-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-top:38px
    }
    .service{
      display:flex;
      flex-direction:column;
      min-height:390px;
      padding:28px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(180deg,var(--panel-2),var(--panel));
      box-shadow:var(--shadow)
    }
    .service.popular{
      transform:translateY(-10px);
      border-color:rgba(110,231,249,.25);
      background:
        radial-gradient(circle at 100% 0%,rgba(110,231,249,.10),transparent 40%),
        linear-gradient(180deg,#18222c,#121820)
    }
    .popular-tag{
      align-self:flex-start;
      padding:6px 10px;
      border-radius:99px;
      background:rgba(110,231,249,.12);
      color:var(--accent);
      font-size:10px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.09em;
      margin-bottom:18px
    }
    .service h3{font-size:26px;margin:0 0 10px;letter-spacing:-.035em}
    .service-price{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-bottom:18px}
    .service p{color:var(--muted);margin:0 0 20px}
    .service-meta{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);color:#c3ccd7;font-size:14px}
    .service .btn{margin-top:16px}

    /* automation */
    .auto-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-top:36px
    }
    .mini-card{
      padding:22px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025)
    }
    .mini-icon{
      width:38px;height:38px;
      border-radius:11px;
      display:grid;place-items:center;
      margin-bottom:16px;
      background:rgba(110,231,249,.08);
      color:var(--accent);
      font-weight:800
    }
    .mini-card h3{font-size:17px;margin:0 0 8px}
    .mini-card p{font-size:14px;color:var(--muted);margin:0}

    /* cases */
    .cases{display:grid;gap:28px;margin-top:42px}
    .case{
      display:grid;
      grid-template-columns:1.06fr .94fr;
      gap:34px;
      padding:24px;
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg,#131a22,#0f151c);
      box-shadow:var(--shadow)
    }
    .case:nth-child(even){grid-template-columns:.94fr 1.06fr}
    .case:nth-child(even) .case-visual{order:2}
    .case-visual{
      min-height:420px;
      border-radius:20px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background:#0b1118;
      position:relative;
      display:grid;
      place-items:center
    }
    .case-info{padding:22px 12px}
    .demo-tag{
      display:inline-flex;
      padding:6px 10px;
      border-radius:99px;
      background:rgba(139,92,246,.12);
      color:#c4b5fd;
      font-size:10px;
      font-weight:800;
      letter-spacing:.09em;
      text-transform:uppercase;
      margin-bottom:16px
    }
    .case h3{margin:0 0 18px;font-size:30px;letter-spacing:-.04em;line-height:1.1}
    .case-block{margin-top:20px}
    .case-block strong{display:block;font-size:13px;margin-bottom:5px}
    .case-block p{margin:0;color:var(--muted);font-size:14px}
    .case-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

    /* custom case visuals */
    .garage-ui{
      width:90%;height:82%;
      border-radius:16px;
      overflow:hidden;
      background:#f4f1eb;
      color:#1b1b1b;
      box-shadow:0 24px 60px rgba(0,0,0,.32)
    }
    .garage-nav{display:flex;justify-content:space-between;padding:16px 20px;font-size:10px;font-weight:800}
    .garage-hero{
      height:48%;
      padding:30px 24px;
      background:linear-gradient(120deg,#242424,#444);
      color:#fff
    }
    .garage-hero b{display:block;font-size:30px;line-height:1.05;max-width:80%;letter-spacing:-.05em}
    .garage-hero span{font-size:10px;color:#d7d7d7}
    .garage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
    .garage-card{height:70px;border-radius:10px;background:#fff;border:1px solid #ddd7ce;padding:10px;font-size:9px;font-weight:700}

    .beauty-phone{
      width:220px;height:440px;
      border-radius:36px;
      background:#030405;
      padding:10px;
      box-shadow:0 28px 80px rgba(0,0,0,.55);
      transform:rotate(-4deg)
    }
    .beauty-screen{
      height:100%;border-radius:27px;overflow:hidden;
      background:#f4eef4;color:#302333;padding:20px 14px
    }
    .beauty-head{text-align:center;font-weight:800;font-size:12px;margin-bottom:18px}
    .beauty-msg{
      background:white;
      border-radius:12px;
      padding:10px;
      margin:8px 0;
      font-size:9px
    }
    .beauty-option{
      text-align:center;
      margin:7px 0;
      padding:8px;
      border-radius:8px;
      background:#ad7ca8;
      color:#fff;
      font-size:9px;
      font-weight:800
    }
    .mini-flow{
      position:absolute;
      bottom:26px;
      right:24px;
      left:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      flex-wrap:wrap;
      font-size:9px;
      color:#c5cfda
    }
    .mini-flow span{
      padding:6px 8px;
      border-radius:8px;
      background:#151d26;
      border:1px solid var(--line)
    }

    .automation-board{
      width:92%;
      display:grid;
      grid-template-columns:1fr 56px 1fr 56px 1fr;
      align-items:center;
      gap:8px
    }
    .automation-node{
      min-height:112px;
      padding:16px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#151d26
    }
    .automation-node small{color:#8fa0b2}
    .automation-node strong{display:block;margin-top:6px;font-size:15px}
    .automation-arrow{text-align:center;color:var(--accent);font-size:24px}
    .subnodes{
      position:absolute;
      left:32px;right:32px;bottom:34px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px
    }
    .subnode{
      padding:12px;border-radius:12px;background:#111820;border:1px solid var(--line);
      color:#cbd5df;font-size:10px
    }


    /* real project previews */
    .site-preview{
      position:relative;
      width:100%;
      min-height:420px;
      overflow:hidden;
      background:#090d12;
      border-radius:20px;
    }
    .site-preview iframe{
      position:absolute;
      inset:0 auto auto 0;
      width:1280px;
      height:820px;
      border:0;
      transform:scale(.47);
      transform-origin:top left;
      pointer-events:none;
      background:#fff;
    }
    .site-preview::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg,transparent 65%,rgba(5,8,12,.32));
    }
    .project-type{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 16px;
      color:#98a7b8;
      font-size:12px;
      font-weight:700;
    }
    .project-type::before{
      content:"";
      width:7px;height:7px;border-radius:50%;
      background:var(--success);
      box-shadow:0 0 0 5px rgba(110,231,183,.08);
    }
    @media(max-width:1180px){
      .site-preview iframe{transform:scale(.42)}
    }
    @media(max-width:980px){
      .site-preview{min-height:430px}
      .site-preview iframe{transform:scale(.55)}
    }
    @media(max-width:680px){
      .site-preview{min-height:300px}
      .site-preview iframe{width:1180px;height:760px;transform:scale(.29)}
    }

    /* process */
    .process-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-top:38px
    }
    .process-item{
      position:relative;
      padding:26px;
      border-top:1px solid rgba(255,255,255,.14)
    }
    .process-num{color:var(--accent);font-weight:800;font-size:12px}
    .process-item h3{margin:9px 0 8px;font-size:19px}
    .process-item p{margin:0;color:var(--muted);font-size:14px}

    /* price cards */
    .pricing{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-top:38px
    }
    .price-card{
      padding:28px;
      border:1px solid var(--line);
      border-radius:22px;
      background:rgba(255,255,255,.025)
    }
    .price-card h3{margin:0 0 10px;font-size:24px}
    .price-card .big{font-size:34px;font-weight:800;letter-spacing:-.04em}
    .price-card ul{padding:0;margin:20px 0;list-style:none;color:#b5bfcb;font-size:14px}
    .price-card li{padding:6px 0}
    .price-card li::before{content:"✓";color:var(--accent);margin-right:8px}
    .price-note{
      margin-top:22px;
      color:var(--muted);
      font-size:14px;
      padding:18px 20px;
      border-radius:15px;
      background:rgba(255,255,255,.025);
      border:1px solid var(--line)
    }

    /* before after */
    .compare{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      margin-top:38px
    }
    .compare-card{
      padding:28px;
      border-radius:22px;
      border:1px solid var(--line);
      background:#111820
    }
    .compare-card.good{background:linear-gradient(180deg,rgba(110,231,249,.06),#111820)}
    .compare-card h3{margin:0 0 18px;font-size:24px}
    .compare-list{display:grid;gap:11px}
    .compare-row{
      display:flex;gap:10px;align-items:flex-start;
      color:#b6c0cd;font-size:14px
    }
    .compare-mark{
      flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
      background:rgba(252,165,165,.08);color:var(--danger);font-size:12px;font-weight:800
    }
    .good .compare-mark{background:rgba(110,231,183,.08);color:var(--success)}

    /* includes */
    .includes-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-top:34px
    }
    .include{
      padding:16px 18px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
      color:#cbd4df;
      font-size:14px
    }

    /* about */
    .about{
      display:grid;
      grid-template-columns:.75fr 1.25fr;
      gap:38px;
      align-items:start
    }
    .about-card{
      min-height:310px;
      border-radius:24px;
      background:
        radial-gradient(circle at 30% 20%,rgba(110,231,249,.15),transparent 30%),
        radial-gradient(circle at 70% 70%,rgba(139,92,246,.15),transparent 35%),
        #111820;
      border:1px solid var(--line);
      display:grid;
      place-items:center;
      text-align:center;
      padding:30px
    }
    .avatar{
      width:100px;height:100px;border-radius:28px;
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.04);
      font-size:36px;font-weight:800
    }
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
    .tag{
      padding:7px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
      color:#b9c4d0;
      font-size:12px
    }

    /* FAQ */
    .faq{margin-top:34px;border-top:1px solid var(--line)}
    details{border-bottom:1px solid var(--line);padding:0}
    summary{
      cursor:pointer;
      list-style:none;
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:22px 0;
      font-weight:700
    }
    summary::-webkit-details-marker{display:none}
    summary::after{content:"+";font-size:22px;color:var(--accent)}
    details[open] summary::after{content:"–"}
    details p{margin:-4px 0 22px;max-width:820px;color:var(--muted);font-size:15px}

    /* CTA */
    .cta-panel{
